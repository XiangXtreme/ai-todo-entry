name: Android CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew lintDebug

      - name: Decode release keystore
        if: ${{ secrets.AI_TODO_KEYSTORE_BASE64 != '' && secrets.AI_TODO_KEYSTORE_PASSWORD != '' && secrets.AI_TODO_KEY_ALIAS != '' && secrets.AI_TODO_KEY_PASSWORD != '' }}
        run: |
          echo "${{ secrets.AI_TODO_KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Build release APK
        env:
          AI_TODO_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.jks
          AI_TODO_KEYSTORE_PASSWORD: ${{ secrets.AI_TODO_KEYSTORE_PASSWORD }}
          AI_TODO_KEY_ALIAS: ${{ secrets.AI_TODO_KEY_ALIAS }}
          AI_TODO_KEY_PASSWORD: ${{ secrets.AI_TODO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-todo-entry-release-apk
          path: app/build/outputs/apk/release/*.apk
